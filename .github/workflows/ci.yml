name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir worker typecheck
      - run: pnpm --dir cli typecheck
      - run: pnpm --dir worker test
      - run: pnpm --dir cli test

  sdk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
